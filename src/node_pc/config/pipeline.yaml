lidar_timestamp_shift:
  input_topic: "/livox/lidar"
  output_topic: "/livox/lidar_shifted"
  # timestamp_offset: Converts LiDAR device-relative time to Unix/sim time
  # Calculated from calibration bag analysis (bag record time - header.stamp).
  # This clock-domain conversion is valid for the current calibration bag set;
  # recalculate it after a LiDAR clock reset/restart for live operation.
  timestamp_offset: 1739510486.944657
  # capture_offset: Compensates for sensor capture delay difference between LiDAR and Camera
  # This ensures both sensors capture the same environmental event at the same timestamp
  # Added after clock conversion because the cloud header refers to its first
  # point while the represented scene occurs later.
  capture_offset: 0.03243  # seconds (32.43 ms)
  verbose: false  # Set to true to show timestamp shift details

pointcloud_merger:
  input_topic: "/livox/lidar_shifted"
  output_topic: "/livox/lidar_merged"
  queue_size: 10
  consecutive_count: 10  # 10 Hz input -> one 10-frame stacked cloud per second
  # overlapping_merge: If true, uses sliding window (frame reused in multiple outputs)
  #                    If false, each frame is used only once (non-overlapping batches)
  overlapping_merge: false
  reset_topic: "/image_enhancement"
  image_enhancement: false
  verbose: false  # Set to true to show merge details

pointcloud_voxel_filter:
  input_topic: "/livox/lidar_merged"
  output_topic: "/livox/lidar_filtered"
  radial_filter_enabled: true
  # Reduce each source frame before the costlier radius-neighbour search.
  # Set false only when reproducing the legacy radius-then-voxel result.
  voxel_before_radial: true
  radius_search: 0.05
  min_neighbors: 2
  enabled: true
  leaf_size: 0.02
  enabled_topic: "/voxel_downsampling"
  leaf_size_topic: "/voxel_leaf_size"
  enabled_status_topic: "/voxel_downsampling/status"
  leaf_size_status_topic: "/voxel_leaf_size/status"
  queue_size: 2
  verbose: false

# Monitor status sync tolerance for LiDAR vs Camera timestamp comparison
monitor_status:
  sync_tolerance: 0.1  # seconds - threshold to consider timestamps as synced

image_enhancer:
  enabled: 0
  input_topic: "/camera/image_raw"
  output_topic: "/camera/image_enhanced"
  enhancement_topic: "/image_enhancement"
  status_topic: "/image_enhancement/status"
  backend: "torchscript"
  threads: 4
  affinity: "auto"
  warmup_runs: 2
  queue_size: 1
  buffer_size: 16777216

pointcloud_colorizer:
  input_topic: "/livox/lidar_filtered"
  output_topic: "/merged_colored_cloud"
  image_topic: "/camera/image_raw"
  enhanced_image_topic: "/camera/image_enhanced"
  image_enchantment_topic: "/image_enhancement"   # std_msgs/Bool to toggle enhancement
  image_enchantment: 0  # 0=off, 1=use enhanced image if available
  queue_size: 10
  image_history_size: 100
  max_pending_clouds: 2
  sync_tolerance: 0.05  # seconds
  # Publish the synchronized subset of each ten-scan batch. Raw mode normally
  # retains all ten; enhanced mode may retain fewer when inference drops frames.
  allow_partial_batches: true
  min_synchronized_frames: 5
  # Wait after a filtered cloud arrives before finalizing an incomplete batch.
  partial_batch_timeout: 0.30  # wall seconds
  matched_frames_topic: "/merged_colored_cloud/matched_frames"
  input_frames_topic: "/merged_colored_cloud/input_frames"
  point_count_topic: "/merged_colored_cloud/point_count"
  dropped_batches_topic: "/merged_colored_cloud/dropped_batches"
  verbose: false  # Set to true to show detailed publish/skip messages
  camera_matrix: [[224.514866, 0.0, 243.278429],
                  [0.0, 224.340765, 181.763517],
                  [0.0, 0.0, 1.0]]
  dist_coeffs: [-0.212691, 0.087036, 0.0, 0.0, 0.0]
  # LiDAR-to-camera extrinsic transform (4x4 homogeneous matrix)
  # [R | T]
  # [0 0 0 1]
  extrinsic_matrix: [2.11139458e-02, -9.99576985e-01, -2.00013204e-02, -1.17632719e-02,
                     4.27803906e-02, 2.08907401e-02, -9.98866065e-01, -2.80177840e-02,
                     9.98861372e-01, 2.02343397e-02, 4.32033798e-02, 2.47156238e-01,
                     0.00000000e+00, 0.00000000e+00, 0.00000000e+00, 1.00000000e+00]
  image_width: 484
  image_height: 366
